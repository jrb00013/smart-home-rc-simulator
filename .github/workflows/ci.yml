name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c:
    name: C (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    # clang currently fails on an implicit usleep() declaration in
    # src/connection.c; remove allow-failure once that is fixed.
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            allow-failure: false
          - cc: clang
            allow-failure: true
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain versions
        run: |
          $CC --version
          make --version | head -1

      - name: Build
        run: make CC="$CC"

      - name: Build examples
        run: make examples CC="$CC"

      - name: Unit tests (make test)
        run: |
          if make -n test >/dev/null 2>&1; then
            make test CC="$CC"
          else
            echo "::notice::No 'make test' target yet; skipping."
          fi

      - name: Sanitizers (make sanitize)
        run: |
          if make -n sanitize >/dev/null 2>&1; then
            make clean
            make sanitize CC="$CC"
          else
            echo "::notice::No 'make sanitize' target yet; skipping."
          fi

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: test_simulator
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: test_simulator/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements.txt -r requirements-dev.txt
          else
            echo "::notice::requirements-dev.txt not found; installing pytest and ruff directly."
            pip install -r requirements.txt pytest ruff
          fi

      - name: Lint (ruff, syntax/undefined-name errors)
        run: |
          if [ -f requirements-dev.txt ]; then
            ruff check --select E9,F63,F7,F82 .
          else
            # Advisory until the dev-requirements PR lands (it fixes current findings).
            ruff check --select E9,F63,F7,F82 --output-format=github . \
              || echo "::warning::ruff found errors (advisory until requirements-dev.txt exists)."
          fi

      - name: Test
        run: pytest

  js:
    name: JS lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: test_simulator
    steps:
      - uses: actions/checkout@v7

      - name: Detect package.json
        id: pkg
        run: |
          echo "present=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "lock=$([ -f package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.pkg.outputs.present == 'true'
        with:
          node-version: 22
          cache: ${{ steps.pkg.outputs.lock == 'true' && 'npm' || '' }}
          cache-dependency-path: test_simulator/package-lock.json

      - name: Install
        if: steps.pkg.outputs.present == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: ESLint
        if: steps.pkg.outputs.present == 'true'
        run: npx eslint web_static/js

      - name: Skip notice
        if: steps.pkg.outputs.present != 'true'
        run: echo "::notice::test_simulator/package.json not found; skipping JS lint."

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: test_simulator
          push: false
          load: true
          tags: tv-remote:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container becomes healthy)
        run: |
          docker run -d --name tv-remote -p 5000:5000 tv-remote:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' tv-remote)
            echo "health: $status"
            [ "$status" = healthy ] && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:5000/api/health
          test "$(docker inspect -f '{{.State.Health.Status}}' tv-remote)" = healthy
          test "$(docker inspect -f '{{.Config.User}}' tv-remote)" = app

      - name: Container logs
        if: always()
        run: docker logs tv-remote || true
