[tool.poetry]
name = "phillips-tv-simulator"
version = "1.0.0"
description = "Virtual TV Simulator for Phillips Universal Remote Control - 3D/VR Web Interface and Desktop Simulator"
authors = ["Phillips Remote Control Project"]
readme = "README.md"
packages = [{include = "*.py"}]

[tool.poetry.dependencies]
python = ">=3.8.1"
flask = "^2.0.0"
flask-socketio = "^5.0.0"
python-socketio = "^5.0.0"
pygame = "^2.0.0"
requests = "^2.28.0"
pywin32 = {version = ">=300,<312", markers = "sys_platform == 'win32'"}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
ruff = ">=0.4.0"
pillow = ">=9.0.0"
pytest-timeout = "^2.1.0"
black = "^23.0.0"
flake8 = {version = "^6.0.0", python = ">=3.8.1"}

# pytest settings live in pytest.ini (it takes precedence; keeping one source avoids drift).

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["__pycache__", "web_static", "web_templates", "docs"]

[tool.ruff.lint]
# CI gate: syntax errors and undefined names (E9, F63, F7, F82).
select = ["E9", "F63", "F7", "F82"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
web-server = "web_server:main"
desktop-simulator = "main:main"
tv-simulator-web = "web_server:main"
tv-simulator-desktop = "main:main"

